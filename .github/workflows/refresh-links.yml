# v26 — автообновление CDN-ссылок клипов в БД (таблица clips — единственный
# источник ленты; старый CSV-пайплайн из v4 устарел и заменён этим).
#
# Зачем: Threads отдаёт подписанные scontent-ссылки с коротким lease (дни).
# Если подпись умирает до конца раффла, авторезолв помечает раунд void
# («битая ссылка»). Этот крон переоткрывает исходные посты headless-браузером
# и обновляет video_url/фото каруселей ДО того, как ссылки умрут —
# «чтобы всегда был сигнал».
#
# Разовая настройка (bd, 2 минуты):
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#     Name:  DIRECT_URL
#     Value: postgresql://postgres.arwdhvfffzdljctryjfw:<пароль>@aws-1-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require
#   (session-pooler :5432 — долгие браузерные прогоны живут там свободно)
# До добавления секрета джобы проходят зелёными с пометкой «прогон пропущен».
#
# Расписание: каждые 6 часов; прогон ~3–6 минут.
name: refresh-clip-links

on:
  schedule:
    # 37-я минута каждого 6-го часа UTC — в стороне от топа часа
    - cron: "37 */6 * * *"
  workflow_dispatch: {} # ручной запуск из вкладки Actions

permissions:
  contents: read

concurrency:
  group: refresh-clip-links
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DIRECT_URL secret
        id: cfg
        env:
          HAS_DB: ${{ secrets.DIRECT_URL != '' }}
        run: |
          echo "has_db=$HAS_DB" >> "$GITHUB_OUTPUT"
          if [ "$HAS_DB" != "true" ]; then
            {
              echo "### Секрет DIRECT_URL не задан — прогон пропущен"
              echo "Добавь repo secret (Settings → Secrets and variables → Actions):"
              echo '```'
              echo "DIRECT_URL = postgresql://postgres.arwdhvfffzdljctryjfw:<пароль>@aws-1-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require"
              echo '```'
              echo "После этого крон начнёт обновлять ссылки каждые 6 часов."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # скрипту нужны только pg + playwright — полный npm ci не требуется
      - name: Install deps (pg + playwright)
        if: steps.cfg.outputs.has_db == 'true'
        run: |
          npm i --no-save playwright pg
          npx playwright install chromium --with-deps

      # --void-dead: у клипов queued/soon/live с исчезнувшим постом ставить
      # void (по ТЗ «битая ссылка — void»; resolved не трогаем — вердикты
      # остаются в витрине даже при умершем видео)
      - name: Refresh dead links in DB
        if: steps.cfg.outputs.has_db == 'true'
        run: node scripts/v26_refresh_dead.mjs --void-dead
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### refresh-clip-links"
            echo "- время (UTC): $(date -u '+%Y-%m-%d %H:%M')"
            echo "- лог выше: проверено / живых / обновлено / неудач"
            echo "- следующий прогон через 6 часов (или запуск вручную из Actions)"
          } >> "$GITHUB_STEP_SUMMARY"
